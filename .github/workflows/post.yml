name: daily post

on:
  schedule:
    - cron: "30 12 * * *"   # 18:00 IST. GitHub cron is UTC and can drift 5-15 min.
  workflow_dispatch:         # lets you trigger a test run from the Actions tab

permissions:
  contents: write            # needed to commit the generated image
  issues: write              # setup-time run log reporting

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate image + caption
        id: gen
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p debug
          set -o pipefail
          python post.py 2>&1 | tee debug/last_run.log

      - name: Commit image so Meta can fetch it
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add posts/
          git commit -m "post $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Publish to Instagram
        id: pub
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -o pipefail
          python publish.py 2>&1 | tee -a debug/last_run.log

      - name: Report run log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNID: ${{ github.run_id }}
        run: python report.py

      - name: Surface failure
        if: steps.gen.outcome != 'success' || steps.pub.outcome != 'success'
        run: exit 1
