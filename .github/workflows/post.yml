name: daily post

on:
  schedule:
    # 4x daily, every 6h: 05:37 / 11:37 / 17:37 / 23:37 IST.
    # Odd minute on purpose -- the top of the hour is the most contended slot
    # on GitHub's scheduler and drifts the most.
    - cron: "7 0,6,12,18 * * *"
  workflow_dispatch:         # lets you trigger a test run from the Actions tab

permissions:
  contents: write            # needed to commit the generated image
  issues: write              # setup-time run log reporting

# Two runs must never push to main at once.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate image + caption
        id: gen
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p debug
          set -o pipefail
          python post.py 2>&1 | tee debug/last_run.log

      - name: Commit image so Meta can fetch it
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add posts/
          git commit -m "post $(date -u +%F)" || echo "nothing to commit"
          # Another run may push between our rebase and our push, so retry the
          # whole rebase-and-push cycle rather than rebasing once up front.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after 4 attempts" >&2
          exit 1

      - name: Publish to Instagram
        id: pub
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -o pipefail
          python publish.py 2>&1 | tee -a debug/last_run.log

      - name: Report run log
        if: steps.gen.outcome != 'success' || steps.pub.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNID: ${{ github.run_id }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python report.py

      - name: Surface failure
        if: steps.gen.outcome != 'success' || steps.pub.outcome != 'success'
        run: exit 1
